syntax = "proto3";

package search;

import "google/protobuf/empty.proto";

//Index service definition

service StorageBarrel{
    rpc addToIndex (AddToIndexRequest) returns (google.protobuf.Empty);
    rpc searchWord (SearchWordRequest) returns (SearchWordResponse);
    rpc putNew (PutNewRequest) returns (google.protobuf.Empty); 
    rpc takeNext (google.protobuf.Empty) returns (TakeNextResponse); 
    rpc getIndexSize (google.protobuf.Empty) returns (BarrelSizeResponse);
}

service Gateway{
    rpc putNew (PutNewRequest) returns (google.protobuf.Empty);
    rpc takeNext (google.protobuf.Empty) returns (TakeNextResponse);
    rpc addToIndex (AddToIndexRequest) returns (google.protobuf.Empty);
    rpc searchWord (SearchWordRequest) returns (SearchWordResponse);
    rpc getBacklinks (PutNewRequest) returns (BacklinksResponse);
    rpc getStatistics (google.protobuf.Empty) returns (StatisticsResponse);
}

service Downloader{
    rpc getBacklinks (PutNewRequest) returns (BacklinksResponse);
}

// Messages for addToIndex method
message AddToIndexRequest{
    string word = 1;
    string url = 2;
    string title = 3;
    string citacao = 4;
    int32 links_count = 5;
}

// Messages for searchWord method
message SearchWordRequest {
    string word = 1;
}

message SearchResult {
    string url = 1;
    string title = 2;
    string text = 3;
    int32 links_count = 4;
}

message SearchWordResponse {
    repeated SearchResult results = 1;
}

message TakeNextResponse {
    string url = 1;
}

message PutNewRequest {
  string url = 1;
}

message BacklinksResponse {
    repeated string backlinks = 1;
}

message BarrelSizeResponse {
    int64 size = 1; 
}

message BarrelStatistic {
    string barrel_id = 1; 
    int64 index_size = 2; 
    double avg_response_time = 3; 
}

message StatisticsResponse {
    repeated string top_searches = 1; 
    repeated BarrelStatistic barrel_stats = 2;
}