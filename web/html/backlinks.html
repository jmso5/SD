{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Backlinks para:</h2>
    <p><strong>{{ url }}</strong></p>

    <ul class="backlinks-list">
        {% if backlinks %}
            {% for link in backlinks %}
            <li><a href="{{ link }}">{{ link }}</a></li>
            {% endfor %}
        {% else %}
            <li>Nenhum backlink conhecido para este URL.</li>
        {% endif %}
    </ul>
</div>
{% endblock %}
