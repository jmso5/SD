<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Googol SD</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1><a href="/">Googol SD</a></h1>
        <form action="/search" method="get" class="search-form">
            <input type="text" name="q" placeholder="Pesquisar..." value="{{ query | default('') }}">
            <button type="submit">Pesquisar</button>
        </form>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        Sistemas Distribuídos 2025/26
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
