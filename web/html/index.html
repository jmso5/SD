{% extends "base.html" %}

{% block content %}
<div class="container">
    <section class="submit-url">
        <h2>Indexar Novo URL</h2>
        <form action="/submit-url" method="post">
            <input type="text" name="url" placeholder="http://exemplo.com" required>
            <button type="submit">Submeter URL</button>
        </form>
    </section>

    <section class="stats">
        <h2>Estatísticas do Sistema (em Tempo Real)</h2>
        <div id="stats-container">
            A carregar estatísticas...
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/stats.js"></script>
{% endblock %}
