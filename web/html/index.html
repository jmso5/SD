<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Googol</title>
    <link href="/web/html/styling/indexStyling.css" rel="stylesheet" type="text/css">
    <script>
        /**
         * Envia o formulário de pesquisa ou indexação usando AJAX.
         * @param {Event} event - O evento de envio do formulário.
         */
        async function submitForm(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const input = formData.get('input');
            const action = formData.get('action');

            if (!action) {
                alert("Please select an option.");
                return;
            }

            if (action === 'index' && !isValidUrl(input)) {
                alert("Invalid URL. Please enter a URL that starts with https:// or http://.");
                return;
            }

            try{
                if (action === 'index'){

                    const response = await fetch('/index_url', { // Rota corrigida para /index_url
                    method: 'post',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({ 'url': input }) // Parâmetro corrigido para 'url'
                    });

                    if (response.ok) {
                        const result = await response.json();
                        alert(result.message); 
                    } else {
                        alert("Failed to submit URL.");
                    }
                }
                else if (action === 'search'){
                    // Rota corrigida para /search_word
                    window.location.href = `/search_word?query=${encodeURIComponent(input)}`; 
                }
                
            
            }catch (error){
                console.error("Error:", error);
                alert("An error occurred while submitting.");
            }
        }

        // validar urls
        /**
         * Verifica se a URL é válida e começa com http:// ou https://
         * @param {string} url - A URL a ser verificada.
         * */
        function isValidUrl(url) {
            try {
                const parsedUrl = new URL(url);
                return (parsedUrl.protocol === "http:" || parsedUrl.protocol === "https:") && url.includes("//");
            } catch (e) {
                return false;
            }
        }
    </script>
</head>
<body>
    <div class="search-container">
        <h2>Bem-vindo ao</h2>
        <h1>Go<img src="/web/html/images/logo.png" style="height: 80px; vertical-align: middle;">gol</h1>
        <form onsubmit="submitForm(event)" class="search-bar">
        <select name="action" id="action" class="toggle-select">
            <option value="" disabled selected>Selecionar Ação</option>
            <option value="index">Indexar URL</option>
            <option value="search">Pesquisar Palavras</option>
        </select>
        <input type="text" class="search-input" id="input" name="input" placeholder="Pesquisar ou Indexar..." required>
        <button type="submit" class="search-button">Executar</button>
    </form>
    
    </div>
    <div id="monitor-card" class="monitor-card">
        <h3 style="text-align: center; font-size: 24px; color: #4a4a4a; margin-bottom: 25px;">Estatísticas do Servidor</h3>
        <div class="columns-container">
            <div class="column">
                <h4>Top 10 Pesquisas</h4>
                <ul id="top-searches-list">
                    <li>Nenhuma pesquisa registada.</li>
                </ul>
            </div>
            <div class="column">
                <h4>Tempo de Resposta dos Barrels (ds)</h4>
                <table>
                    <thead>
                    <tr>
                        <th>Barrel</th>
                        <th>Tempo Médio</th>
                    </tr>
                    </thead>
                    <tbody id="barrel-timings-table">
                    <tr><td colspan="2">Aguardando dados...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="column">
                <h4>Barrels Ativos: Tamanho do Índice</h4>
                <table>
                    <thead>
                    <tr>
                        <th>Barrel</th>
                        <th>Tamanho do Índice</th>
                    </tr>
                    </thead>
                    <tbody id="active-barrels-table">
                    <tr><td colspan="2">Aguardando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
     <script src="/static/assets/websocket.js?v=<%= Date.now() %>"></script>
</body>
</html>
