<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Googol</title>
    <link href="/web/html/styling/indexStyling.css" rel="stylesheet" type="text/css">
    <link href="/web/html/styling/background.css" rel="stylesheet" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <script>

        // Botão para alternar entre os modos de pesquisa e indexação
        function toggleMode() {
            const toggleButton = document.getElementById('toggle-mode-button'); 
            const actionInput = document.getElementById('action');
            const toggleIcon = document.getElementById('toggle-icon');
            const searchInput = document.getElementById('input');


            if (actionInput.value === 'search') {
                // Mudar para o modo INDEXAR URL
                actionInput.value = 'index';
                toggleIcon.src = '/web/html/images/search-icon.png'; 
                toggleIcon.alt = 'Modo Indexar URL';
                searchInput.placeholder = 'Indexar URL';
                toggleButton.setAttribute('data-tooltip', 'Mudar para Pesquisar Palavras');
            } else {
                // Mudar para o modo PESQUISAR PALAVRAS
                actionInput.value = 'search';
                toggleIcon.src = '/web/html/images/link-icon.png'; 
                toggleIcon.alt = 'Modo Pesquisar Palavras';
                searchInput.placeholder = 'Pesquisar Palavras';
                toggleButton.setAttribute('data-tooltip', 'Mudar para Indexar URL');
            }
        }



        // Envia o formulário para indexar URL ou pesquisar palavras
        async function submitForm(event) {
            event.preventDefault();
            const form = event.target; 
            const formData = new FormData(form);
            const input = formData.get('input');
            const action = document.getElementById('action').value;

        
            if (action === 'index' && !isValidUrl(input)) {
                alert("Invalid URL. Please enter a URL that starts with https:// or http://.");
                return;
            }

            try{
                // Verifica a ação e envia para a rota correta
                if (action === 'index'){

                    const response = await fetch('/index_url', { 
                    method: 'post',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({ 'url': input }) 
                    });

                    if (response.ok) {
                        const result = await response.json();
                        alert(result.message); 
                    } else {
                        alert("Failed to submit URL.");
                    }
                }
                else if (action === 'search'){
                    // Rota corrigida para /search_word
                    window.location.href = `/search_word?query=${encodeURIComponent(input)}`; 
                }

            
            }catch (error){
                console.error("Error:", error);
                alert("An error occurred while submitting.");
            }
        }

        // verifica se o url é válido ou seja se começa com http:// ou https://
        function isValidUrl(url) {
            try {
                const parsedUrl = new URL(url);
                return (parsedUrl.protocol === "http:" || parsedUrl.protocol === "https:") && url.includes("//");
            } catch (e) {
                return false;
            }
        }

        const host = window.location.host;
        const wsUrl = `ws://${host}/ws/stats`;
        let ws;
        
        // função para conectar ao WebSocket
        function connectWebSocket(){
            ws = new WebSocket(wsUrl); // cria uma nova conexão WebSocket

            ws.onopen = function(event) {
                console.log("WebSocket connection established.");
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                updateStats(data); 
            };

            ws.onclose = function(event) {
                console.log("WebSocket connection closed. Reconnecting in 5 seconds...");
                setTimeout(connectWebSocket, 5000); 
            };

            ws.onerror = function(error) {
                console.error("WebSocket error:", error);
            };
        }

        // função para atualizar as estatísticas na interface
        function updateStats(stats){
            // atualizar Top 10 Pesquisas
            const topSearchesList = document.getElementById("top-searches-list");
            topSearchesList.innerHTML = "";
            
            if(stats.top_searches && stats.top_searches.length > 0){
                stats.top_searches.forEach((word, index) => {
                    topSearchesList.innerHTML += `<li>${index + 1}. ${word}</li>`;
                });
            } else {
                topSearchesList.innerHTML = "<li>Nenhuma pesquisa registada.</li>";
            }
            // tempo de resposta e tamanho do índice
            const timingTable = document.getElementById("barrel-timings-table");
            const indexTable = document.getElementById("active-barrels-table");
            timingTable.innerHTML = "";
            indexTable.innerHTML = "";

            if(stats.barrel_stats && stats.barrel_stats.length > 0){
                stats.barrel_stats.forEach(stat => {
                    const displayID = stat.barrel_id.split(':').pop(); // mostra apenas a porta

                    // tabela de tempos
                    timingTable.innerHTML += `
                        <tr>
                            <td>Porta ${displayID}</td>
                            <td>${stat.avg_response_time}</td>
                        </tr>
                    `;

                    // tabela de tamanhos do índice
                    indexTable.innerHTML += `
                        <tr>
                            <td>Porta ${displayID}</td>
                            <td>${stat.index_size}</td>
                        </tr>
                    `;
                });
            } else {
                timingTable.innerHTML = "<tr><td colspan='2'>Nenhum Barrel ativo.</td></tr>";
                indexTable.innerHTML = "<tr><td colspan='2'>Nenhum Barrel ativo.</td></tr>";
            }
        }
        // iniciar a conexão WebSocket ao carregar a página
        window.onload = function() {
            connectWebSocket();
        };

    
    </script>
</head>
<body>
    <!-- Mind Flayer Background -->
    <div class="mind-flayer-background" id="mind-flayer"></div>
    <div class="mind-flayer-glow" id="mind-flayer-glow"></div>

    <!-- Container de Raios Realistas do Upside Down -->
    <div class="lightning-container" id="lightning-container"></div>

    <!-- Flash de tela -->
    <div class="screen-flash" id="screen-flash"></div>

    <!-- Brilho ambiente -->
    <div class="ambient-glow"></div>

    <script src="/web/html/background.js"></script>

    
    <div class="search-container">
        <h2>Bem-vindo ao</h2>
        <h1>Go<img src="/web/html/images/logo.jpg" class= "logo-img" id="logo-img">gol</h1>
      

        <form onsubmit="submitForm(event)" class="search-bar">
    
            <input type="hidden" name="action" id="action" value="search">
            
            <button type="button" id="toggle-mode-button" class="toggle-mode-button " onclick="toggleMode()"  data-tooltip="Mudar para Indexar URL">
                <img id="toggle-icon" src="/web/html/images/link-icon.png"> 
            </button>
            
            <input type="text" class="search-input" id="input" name="input" placeholder="Pesquisar Palavras" required>
            
            <button type="submit" class="search-button" >Executar</button>

        </form>
    </div>

    <!-- Tabelas -->
    <div id="monitor-card" class="monitor-card">
        <h3>Estatísticas do Servidor</h3>
        <div class="columns-container">
            <div class="column">
                <h4>Top 10 Pesquisas</h4>
                <ul id="top-searches-list">
                    <li>Nenhuma pesquisa registada.</li>
                </ul>
            </div>
            <div class="column">
                <h4>Tempo de Resposta dos Barrels (ds)</h4>
                <table>
                    <thead>
                    <tr>
                        <th>Barrel</th>
                        <th>Tempo Médio</th>
                    </tr>
                    </thead>
                    <tbody id="barrel-timings-table">
                    <tr><td colspan="2">Aguardando dados...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="column">
                <h4>Barrels Ativos: Tamanho do Índice</h4>
                <table>
                    <thead>
                    <tr>
                        <th>Barrel</th>
                        <th>Tamanho do Índice</th>
                    </tr>
                    </thead>
                    <tbody id="active-barrels-table">
                    <tr><td colspan="2">Aguardando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="/web/html/confetti.js"></script>
</body>
</html>
